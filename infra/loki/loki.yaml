# Loki: log store (indexes labels only, not full text).
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true   # required for OTLP: trace_id, span_id... are stored here
  volume_enabled: true
  ingestion_rate_mb: 32
  ingestion_burst_size_mb: 64
  retention_period: 48h

pattern_ingester:
  enabled: true

analytics:
  reporting_enabled: false
