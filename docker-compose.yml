name: cinema-observability

x-app-env: &app-env
  NODE_ENV: production
  PORT: 3000
  DATABASE_URL: postgres://cinema:cinema@postgres:5432/cinema
  DB_POOL_SIZE: 20
  REDIS_URL: redis://redis:6379
  # Redlock can use several independent Redis nodes: redis://r1:6379,redis://r2:6379,redis://r3:6379
  REDLOCK_NODES: redis://redis:6379
  LOCK_TTL_MS: 5000
  LOCK_RETRY_COUNT: 3
  LOCK_RETRY_DELAY_MS: 100
  PAYMENT_DELAY_MS: 50
  # ---- OpenTelemetry: the app only needs the Collector address ----
  OTEL_SERVICE_NAME: booking-api
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_SEMCONV_STABILITY_OPT_IN: http
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=cinema

services:
  # ======================= Application =======================
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: cinema
      POSTGRES_DB: cinema
    command: ["postgres", "-c", "max_connections=200"]
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pg-data:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinema -d cinema"]
      interval: 3s
      retries: 20

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  # 2 replicas to prove the DISTRIBUTED lock (Redlock) works across processes
  booking-api:
    restart: unless-stopped
    build: ./app
    image: cinema/booking-api:latest
    environment: *app-env
    deploy:
      replicas: 2
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      otel-collector: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 5s
      retries: 20

  nginx:
    restart: unless-stopped
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["8080:80"]
    depends_on:
      booking-api: { condition: service_healthy }

  # ======================= Observability =======================
  otel-collector:
    restart: unless-stopped
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus exporter (app metrics)
    depends_on: [tempo, loki]

  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
      - --web.enable-remote-write-receiver   # receives metrics from k6 and the Tempo metrics-generator
      - --enable-feature=exemplar-storage
      - --enable-feature=created-timestamp-zero-ingestion
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prom-data:/prometheus
    ports: ["9090:9090"]

  tempo:
    restart: unless-stopped
    image: grafana/tempo:2.7.2
    user: "0"
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports: ["3200:3200"]

  loki:
    restart: unless-stopped
    image: grafana/loki:3.4.2
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./infra/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports: ["3100:3100"]

  grafana:
    restart: unless-stopped
    image: grafana/grafana:11.6.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/cinema-booking.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus, tempo, loki]

  redis-exporter:
    restart: unless-stopped
    image: oliver006/redis_exporter:v1.67.0
    environment:
      REDIS_ADDR: redis://redis:6379
      # Read the remaining-seat counter straight from Redis (single source, never stale per replica)
      REDIS_EXPORTER_CHECK_KEYS: showtime:*:remaining
    depends_on: [redis]

  postgres-exporter:
    restart: unless-stopped
    image: prometheuscommunity/postgres-exporter:v0.16.0
    environment:
      DATA_SOURCE_NAME: postgresql://cinema:cinema@postgres:5432/cinema?sslmode=disable
    depends_on: [postgres]

  # ======================= Load test =======================
  # Run: docker compose run --rm k6 run /scripts/burst.js
  k6:
    image: grafana/k6:0.57.0
    profiles: ["k6"]
    environment:
      BASE_URL: http://nginx
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: "p(50),p(95),p(99),max"
      K6_OUT: experimental-prometheus-rw
    volumes:
      - ./k6:/scripts:ro
    depends_on: [nginx]

volumes:
  pg-data:
  prom-data:
  tempo-data:
  loki-data:
